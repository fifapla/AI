<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعد حجوزات المطعم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Lora:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF3EA;
    --panel: #FFFDF9;
    --ink: #2B1B15;
    --ink-soft: #7A5C4C;
    --primary: #6B2737;
    --primary-deep: #4E1B27;
    --gold: #B4823E;
    --bubble-user: #6B2737;
    --bubble-user-text: #FBF3EA;
    --bubble-bot: #F1E4D6;
    --border: #E7D6C3;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #241512;
      --panel: #2E1C18;
      --ink: #F3E7DD;
      --ink-soft: #C7A897;
      --primary: #C25E72;
      --primary-deep: #A3475A;
      --gold: #D9A75E;
      --bubble-user: #A3475A;
      --bubble-user-text: #FCEFE7;
      --bubble-bot: #3B2620;
      --border: #4A2E27;
    }
  }
  :root[data-theme="dark"] {
    --bg: #241512; --panel: #2E1C18; --ink: #F3E7DD; --ink-soft: #C7A897;
    --primary: #C25E72; --primary-deep: #A3475A; --gold: #D9A75E;
    --bubble-user: #A3475A; --bubble-user-text: #FCEFE7; --bubble-bot: #3B2620; --border: #4A2E27;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Tajawal', system-ui, sans-serif;
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  .wrap { max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; padding: 16px; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 16px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 20px 20px 0 0;
  }
  .logo {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-deep));
    display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 20px; flex-shrink: 0;
  }
  header .title { font-family: 'Lora', serif; font-weight: 600; font-style: italic; font-size: 18px; }
  header .subtitle { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); display: inline-block; margin-inline-end: 5px; }

  .chat {
    flex: 1; background: var(--panel); border-inline: 1px solid var(--border);
    overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; align-items: flex-end; gap: 8px; }
  .row.user { flex-direction: row-reverse; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: var(--primary); color: var(--gold); font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .msg { max-width: 78%; padding: 11px 15px; border-radius: 16px; font-size: 14.5px; line-height: 1.65; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .msg.bot { background: var(--bubble-bot); border-bottom-right-radius: 4px; }
  .msg.user { background: var(--bubble-user); color: var(--bubble-user-text); border-bottom-left-radius: 4px; }
  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft); animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: var(--panel); border-inline: 1px solid var(--border); }
  .chip {
    font-size: 12.5px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--gold);
    color: var(--primary-deep); background: transparent; cursor: pointer; font-weight: 500;
    transition: background .12s ease;
  }
  .chip:hover { background: var(--bubble-bot); }

  form { display: flex; gap: 8px; padding: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 0 0 20px 20px; }
  input[type=text] {
    flex: 1; border: 1px solid var(--border); background: var(--bg); color: var(--ink);
    border-radius: 14px; padding: 12px 14px; font-size: 14.5px; font-family: inherit;
  }
  input[type=text]:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  button.send { background: var(--primary); color: var(--bubble-user-text); border: none; border-radius: 14px; padding: 0 18px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; }
  button.send:active { background: var(--primary-deep); }

  .footnote { text-align: center; font-size: 11px; color: var(--ink-soft); padding: 10px 4px 2px; }
  .footnote b { color: var(--gold); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🍽</div>
    <div>
      <div class="title">مساعد حجوزات المطعم</div>
      <div class="subtitle"><span class="status-dot"></span>جاهز لاستقبال طلبك</div>
    </div>
  </header>

  <div class="chat" id="chat"></div>
  <div class="suggestions" id="suggestions"></div>

  <form id="form">
    <input type="text" id="input" placeholder="اسألني عن الحجز أو المنيو..." autocomplete="off">
    <button class="send" type="submit">إرسال</button>
  </form>

  <div class="footnote">نموذج تجريبي · <b>هذا ديمو</b> يعمل من قاعدة معرفة ثابتة</div>
</div>

<script>
const KB = [
  { keys: ["حجز","طاولة","احجز"], a: "تمام، قولي كام شخص والتاريخ والوقت المناسب، وأأكدلك الحجز على طول." },
  { keys: ["منيو","المنيو","قائمة الطعام","الأكلات"], a: "عندنا قائمة مشويات، مأكولات بحرية، وأطباق نباتية. تحب أرشحلك طبق مميز؟" },
  { keys: ["دليفري","توصيل","اطلب اونلاين"], a: "أيوه، بنوصل في نطاق ١٠ كيلو من الفرع. أقل طلب للتوصيل ١٥٠ جنيه." },
  { keys: ["مواعيد","فاتحين","الساعة كام","الدوام"], a: "فاتحين يوميًا من ١٢ الضهر لحد ١ بعد نص الليل." },
  { keys: ["سعر","اسعار","تكلفة"], a: "الأسعار بتختلف حسب الطبق، متوسط الطبق الرئيسي من ١٨٠ لـ٣٥٠ جنيه." },
  { keys: ["عنوان","فين","الفرع","الموقع"], a: "الفرع الرئيسي في وسط البلد، وفيه فرع تاني في التجمع الخامس." },
  { keys: ["مناسبة","عزومة","حفلة","عدد كبير"], a: "لو مناسبة خاصة أو عدد كبير، عندنا قاعة خاصة — قولي التفاصيل وأنسقلك مع الإدارة." },
];
const FALLBACK = "معلش، مش لاقي إجابة دقيقة لسؤالك. جرب تسأل عن الحجز، المنيو، التوصيل، أو المواعيد.";
const GREETING = "أهلًا بيك 👋 أقدر أساعدك في حجز طاولة، معرفة المنيو، التوصيل، أو أي استفسار تاني.";
const SUGGESTIONS = ["عايز أحجز طاولة", "إيه المنيو عندكم؟", "بتوصلوا فين؟", "فاتحين لحد إمتى؟"];

const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const suggBox = document.getElementById('suggestions');

function addMsg(text, who) {
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const av = document.createElement('div');
  av.className = 'avatar'; av.textContent = who === 'bot' ? '🍽' : 'أ';
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  row.appendChild(av); row.appendChild(el);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}
function showTyping() {
  const row = document.createElement('div');
  row.className = 'row bot'; row.id = 'typingRow';
  const av = document.createElement('div');
  av.className = 'avatar'; av.textContent = '🍽';
  const el = document.createElement('div');
  el.className = 'msg bot typing';
  el.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(av); row.appendChild(el);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() { const t = document.getElementById('typingRow'); if (t) t.remove(); }
function findAnswer(q) {
  for (const item of KB) { if (item.keys.some(k => q.includes(k))) return item.a; }
  return FALLBACK;
}
function renderSuggestions(list) {
  suggBox.innerHTML = '';
  list.forEach(s => {
    const c = document.createElement('div');
    c.className = 'chip'; c.textContent = s;
    c.onclick = () => { input.value = s; form.dispatchEvent(new Event('submit')); };
    suggBox.appendChild(c);
  });
}
form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  addMsg(q, 'user'); input.value = '';
  showTyping();
  setTimeout(() => { hideTyping(); addMsg(findAnswer(q), 'bot'); }, 650);
});
addMsg(GREETING, 'bot');
renderSuggestions(SUGGESTIONS);
</script>
</body>
</html>
