<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعد عيادة الرعاية الأولى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5F1;
    --panel: #FFFFFF;
    --ink: #1E2B28;
    --ink-soft: #5A6B66;
    --primary: #2D6A65;
    --primary-deep: #1F4B47;
    --accent: #C77B4C;
    --bubble-user: #2D6A65;
    --bubble-user-text: #FFFFFF;
    --bubble-bot: #EEF3F1;
    --border: #E1E3DE;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12211E;
      --panel: #17302B;
      --ink: #EAF2EF;
      --ink-soft: #9FB6B0;
      --primary: #4FA79E;
      --primary-deep: #3A8B82;
      --accent: #E0996A;
      --bubble-user: #3A8B82;
      --bubble-user-text: #082421;
      --bubble-bot: #1E3B35;
      --border: #26453E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12211E;
    --panel: #17302B;
    --ink: #EAF2EF;
    --ink-soft: #9FB6B0;
    --primary: #4FA79E;
    --primary-deep: #3A8B82;
    --accent: #E0996A;
    --bubble-user: #3A8B82;
    --bubble-user-text: #082421;
    --bubble-bot: #1E3B35;
    --border: #26453E;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
  }
  .logo {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-deep));
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 20px; flex-shrink: 0;
  }
  header .title { font-weight: 700; font-size: 16px; }
  header .subtitle { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4CAF7D; display: inline-block; margin-inline-end: 5px;
  }

  .chat {
    flex: 1;
    background: var(--panel);
    border-inline: 1px solid var(--border);
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: inset 0 1px 0 rgba(0,0,0,.02);
  }
  .row { display: flex; align-items: flex-end; gap: 8px; }
  .row.user { flex-direction: row-reverse; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: var(--primary); color: #fff; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .msg { max-width: 78%; padding: 11px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.6; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .msg.bot { background: var(--bubble-bot); border-bottom-right-radius: 4px; }
  .msg.user { background: var(--bubble-user); color: var(--bubble-user-text); border-bottom-left-radius: 4px; }
  .msg.bot b { color: var(--primary); }
  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .suggestions {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px;
    background: var(--panel); border-inline: 1px solid var(--border);
  }
  .chip {
    font-size: 12.5px; padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg); color: var(--ink);
    cursor: pointer; transition: transform .12s ease, border-color .12s ease;
  }
  .chip:hover { border-color: var(--primary); transform: translateY(-1px); }

  form {
    display: flex; gap: 8px; padding: 12px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 0 0 18px 18px;
  }
  input[type=text] {
    flex: 1; border: 1px solid var(--border); background: var(--bg);
    color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 14.5px;
    font-family: inherit;
  }
  input[type=text]:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  button.send {
    background: var(--primary); color: white; border: none; border-radius: 14px;
    padding: 0 18px; font-weight: 600; font-size: 14px; cursor: pointer;
    font-family: inherit;
  }
  button.send:active { background: var(--primary-deep); }

  .footnote {
    text-align: center; font-size: 11px; color: var(--ink-soft); padding: 10px 4px 2px;
  }
  .footnote b { color: var(--accent); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">✚</div>
    <div>
      <div class="title">مساعد عيادة الرعاية الأولى</div>
      <div class="subtitle"><span class="status-dot"></span>متصل الآن — يرد فورًا</div>
    </div>
  </header>

  <div class="chat" id="chat"></div>

  <div class="suggestions" id="suggestions"></div>

  <form id="form">
    <input type="text" id="input" placeholder="اكتب سؤالك هنا..." autocomplete="off">
    <button class="send" type="submit">إرسال</button>
  </form>

  <div class="footnote">نموذج تجريبي لتوضيح الفكرة · <b>هذا ديمو</b> يعمل من قاعدة معرفة ثابتة</div>
</div>

<script>
const KB = [
  { keys: ["حجز","موعد","احجز"], a: "تقدر تحجز موعد عن طريق الرابط في البروفايل، أو تقولي التخصص والتاريخ المناسب وأنا أرشّحلك أقرب وقت متاح." },
  { keys: ["مواعيد العمل","الدوام","فاتحين","مواعيد الدوام","الساعة كام"], a: "العيادة فاتحة من السبت للخميس، من الساعة ٩ صباحًا لحد ١٠ بالليل. الجمعة إجازة." },
  { keys: ["سعر","تكلفة","كشف","فلوس"], a: "سعر الكشف العادي يبدأ من ١٥٠ جنيه، وبيختلف حسب التخصص. تحب أقولك سعر تخصص معين؟" },
  { keys: ["تأمين","التأمين الصحي","شركة تأمين"], a: "بنتعامل مع أغلب شركات التأمين المعتمدة محليًا. ابعتلي اسم شركة التأمين بتاعتك وأأكدلك." },
  { keys: ["عنوان","فين","الموقع","مكان العيادة"], a: "العيادة في الدور الأول، مبنى ٧، الحي الطبي — وفيه باركينج مجاني للمرضى." },
  { keys: ["دكتور","تخصص","تخصصات"], a: "متاح عندنا: باطنة، أسنان، جلدية، وعظام. تحب تعرف مواعيد تخصص معين؟" },
  { keys: ["طوارئ","حالة طارئة","مستعجل"], a: "للحالات الطارئة، اتصل بينا مباشرة على الخط الساخن — الشات ده للاستفسارات العامة والحجز بس." },
];
const FALLBACK = "مش متأكد إني فاهم سؤالك صح. ممكن تجرب تسأل عن الحجز، مواعيد الدوام، الأسعار، أو التأمين؟";
const GREETING = "أهلًا بيك 👋 أنا مساعد العيادة الذكي، أقدر أساعدك في الحجز، مواعيد الدوام، الأسعار، والتأمين. اسألني أي حاجة.";
const SUGGESTIONS = ["عايز أحجز موعد", "إيه مواعيد الدوام؟", "بتقبلوا تأمين؟", "فين العيادة؟"];

const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const suggBox = document.getElementById('suggestions');

function addMsg(text, who) {
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = who === 'bot' ? '✚' : 'أ';
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  row.appendChild(av);
  row.appendChild(el);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'row bot';
  row.id = 'typingRow';
  const av = document.createElement('div');
  av.className = 'avatar'; av.textContent = '✚';
  const el = document.createElement('div');
  el.className = 'msg bot typing';
  el.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(av); row.appendChild(el);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById('typingRow');
  if (t) t.remove();
}

function findAnswer(q) {
  const norm = q.trim();
  for (const item of KB) {
    if (item.keys.some(k => norm.includes(k))) return item.a;
  }
  return FALLBACK;
}

function renderSuggestions(list) {
  suggBox.innerHTML = '';
  list.forEach(s => {
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = s;
    c.onclick = () => { input.value = s; form.dispatchEvent(new Event('submit')); };
    suggBox.appendChild(c);
  });
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  addMsg(q, 'user');
  input.value = '';
  showTyping();
  setTimeout(() => { hideTyping(); addMsg(findAnswer(q), 'bot'); }, 650);
});

addMsg(GREETING, 'bot');
renderSuggestions(SUGGESTIONS);
</script>
</body>
</html>
